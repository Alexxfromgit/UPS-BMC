name: Release

# Every push to main updates the Release Please PR (version bump in Cargo.toml and Cargo.lock,
# CHANGELOG.md, from Conventional Commit PR titles). Merging that PR creates the vX.Y.Z tag and a
# draft GitHub release; the same run then builds and tests on Windows, builds the installer and a
# portable zip, uploads them with checksums and provenance, and publishes the release. Users never
# see a release without its downloads.
#
# Run it by hand with an existing tag to rebuild and replace that release's assets.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.2.0
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml and ci.yml.
  RUST_TOOLCHAIN: "1.99"

jobs:
  release-please:
    # Releases live only in the public repository; private copies run CI but never cut releases.
    if: github.event_name == 'push' && github.repository == 'Alexxfromgit/UPS-BMC'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT or GitHub App token, so CI runs on the release PR (PRs opened with GITHUB_TOKEN
          # trigger no workflows). Falls back to GITHUB_TOKEN, which works apart from that.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Release Please bumps the version in Cargo.toml but not in Cargo.lock, and every build uses
  # --locked. Bring the lock file in line on the release branch after each update of the PR.
  sync-lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Update the workspace versions in Cargo.lock
        run: |
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then echo "Cargo.lock already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Cargo.lock for the release"
          git push

  prepare:
    needs: release-please
    if: >-
      ${{ !cancelled() && github.repository == 'Alexxfromgit/UPS-BMC' &&
          (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - id: info
        env:
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1
          fi
          { echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"

  build:
    name: build (Windows x64)
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --workspace --locked
      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: Build release binaries and installer
        shell: pwsh
        run: ./installer/build.ps1
      - name: Stage release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'ups-bmc' | Select-Object -ExpandProperty version
          if ($built -ne $env:VERSION) { throw "Cargo version $built does not match tag v$env:VERSION" }
          $stage = New-Item -ItemType Directory -Force artifacts/stage
          Copy-Item "target/installer/UPS-BMC-setup-$env:VERSION.exe" $stage
          $portable = New-Item -ItemType Directory -Force "artifacts/portable/UPS-BMC-$env:VERSION"
          Copy-Item target/release/ups-bmc.exe, target/release/ups-collector.exe, target/release/hid-probe.exe,
                    README.md, LICENSE $portable
          Compress-Archive -Path "$portable/*" -DestinationPath "$stage/UPS-BMC-$env:VERSION-win-x64-portable.zip"
          Get-ChildItem $stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-win-x64
          path: artifacts/stage
          if-no-files-found: error
          retention-days: 7

  build-pi:
    # Collector for a Raspberry Pi (64-bit Raspberry Pi OS) reading NUT; see docs/raspberry-pi.md.
    # Ubuntu 22.04 keeps the glibc requirement below Raspberry Pi OS Bookworm's.
    name: build (Raspberry Pi collector, Linux arm64)
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test -p ups-collector -p ups-source --no-default-features --locked
      - name: Build
        run: cargo build --release -p ups-collector --no-default-features --locked
      - name: Stage release files
        run: |
          set -euo pipefail
          name="UPS-BMC-$VERSION-linux-arm64-collector"
          mkdir -p "artifacts/$name" artifacts/stage
          cp target/release/ups-collector deploy/raspberry-pi/* docs/raspberry-pi.md README.md LICENSE "artifacts/$name/"
          tar -C artifacts -czf "artifacts/stage/$name.tar.gz" "$name"
          ls -l artifacts/stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-arm64
          path: artifacts/stage
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build, build-pi]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-pi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # build provenance attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed provenance for every download (verify with `gh attestation verify <file> -R <repo>`).
      # GitHub only offers attestations for public repositories on non-Enterprise plans.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Upload assets
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A rebuild replaces everything, so no stale file from the earlier build is left behind.
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r name; do gh release delete-asset "$TAG" "$name" -R "$GITHUB_REPOSITORY" --yes; done
          fi
          gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"

      - name: Publish release
        run: |
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
