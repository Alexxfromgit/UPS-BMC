[package]
name = "ups-collector"
description = "Headless UPS-BMC collector: polls the UPS, stores telemetry and events, serves the local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["hid"]
# Read a USB HID UPS directly. Leave it out for a NUT-only build (Raspberry Pi):
# `cargo build -p ups-collector --no-default-features`.
hid = ["ups-source/hid"]

[dependencies]
ups-analysis.workspace = true
ups-api.workspace = true
ups-model.workspace = true
ups-source.workspace = true
ups-store.workspace = true

anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
directories.workspace = true
getrandom.workspace = true
lettre.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ureq = { workspace = true, features = ["rustls"] }

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
serde.workspace = true
tungstenite.workspace = true
ureq.workspace = true

[lints]
workspace = true
