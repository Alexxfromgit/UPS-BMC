# UPS-BMC is strictly READ-ONLY towards the UPS until an ADR says otherwise.
# Writing to a UPS (SET_FEATURE / output reports) can change its configuration,
# start a self-test, toggle the beeper or even schedule a shutdown of the load.
#
# Devices may only be opened through `ReadOnlyHid` (apps/hid-probe/src/readonly.rs
# for now), which exposes read methods only. Raw handles can't be obtained
# anywhere else. CI runs clippy with -D warnings, and cargo-deny bans other
# USB/HID crates (deny.toml), so the guard can't be bypassed through another
# library.
disallowed-methods = [
    { path = "hidapi::HidDevice::send_feature_report", reason = "UPS-BMC is read-only towards the UPS (ADR-0001)" },
    { path = "hidapi::HidDevice::send_output_report", reason = "UPS-BMC is read-only towards the UPS (ADR-0001)" },
    { path = "hidapi::HidDevice::write", reason = "UPS-BMC is read-only towards the UPS (ADR-0001)" },
    { path = "hidapi::HidApi::open", reason = "open devices via ReadOnlyHid only (ADR-0001)" },
    { path = "hidapi::HidApi::open_path", reason = "open devices via ReadOnlyHid only (ADR-0001)" },
    { path = "hidapi::HidApi::open_serial", reason = "open devices via ReadOnlyHid only (ADR-0001)" },
]
