[workspace]
resolver = "3"
members = ["crates/ups-model", "crates/ups-hid", "apps/hid-probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["UPS-BMC contributors"]
publish = false

[workspace.dependencies]
ups-model = { path = "crates/ups-model" }
ups-hid = { path = "crates/ups-hid" }

anyhow = "1"
bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
hidapi = "2.6"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without value here:
module_name_repetitions = "allow"
missing_errors_doc = "allow" # error enums are documented instead
missing_panics_doc = "allow"
# Read-only guarantee: see clippy.toml (disallowed-methods) and docs/adr/0001-data-source.md
disallowed_methods = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
